name: Browser C# compiler
on:
  workflow_dispatch:
    inputs:
      execution_preview:
        description: Build and test the fixed execution preview package
        type: boolean
        default: false
      editable_preview:
        description: Build the editable C# hosting candidate
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/browser-csharp.yml'
      - 'prototype/browser-csharp/**'
      - 'tests/browser/execution-probe.mjs'
      - 'demo/execution-probe.ts'
      - 'demo/editable-preview.ts'
permissions:
  contents: read
jobs:
  compiler-check:
    env:
      EXECUTION_PREVIEW: ${{ github.event_name == 'pull_request' || inputs.execution_preview }}
      EDITABLE_PREVIEW: ${{ github.event_name == 'pull_request' || inputs.editable_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools --skip-manifest-update
        working-directory: prototype/browser-csharp
      - name: Build browser runtime
        if: env.EXECUTION_PREVIEW == 'true' || env.EDITABLE_PREVIEW != 'true'
        working-directory: prototype/browser-csharp
        run: |
          probe=false
          if [[ "$EXECUTION_PREVIEW" == true ]]; then probe=true; fi
          dotnet publish TryPane.Compiler.csproj -c Release -o ../../dist/compiler -p:EnableExecutionProbe="$probe"
          if [[ "$probe" == true ]]; then
            cp probe-worker.mjs ../../dist/compiler/wwwroot/
          fi
      - name: Install Chromium test dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "TRYPANE_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Check browser C# in Chromium
        if: env.EXECUTION_PREVIEW == 'true' || env.EDITABLE_PREVIEW != 'true'
        run: |
          set -euo pipefail
          if [[ "$EXECUTION_PREVIEW" == true ]]; then
            bash prototype/browser-csharp/runner-host/tools-stage-preview.sh dist/execution-preview "$GITHUB_SHA"
            docker build -t trypane-runner-host:ci dist/execution-preview/runner
            node tests/browser/execution-probe.mjs
            exit
          fi
          python3 -m http.server 8077 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8077/demo/csharp-check.html -o /dev/null; then break; fi
            sleep 0.25
          done
          node tests/browser/compiler-smoke.mjs http://127.0.0.1:8077/
      - uses: actions/upload-artifact@v4
        if: env.EXECUTION_PREVIEW != 'true' && env.EDITABLE_PREVIEW != 'true'
        with:
          name: trypane-browser-csharp-compiler
          path: |
            demo/csharp-check.html
            demo/demo.css
            dist/demo/csharp-check.js
            dist/src/pane.js
            dist/src/runner.js
            dist/compiler/wwwroot/
            dist/compiler-measurements.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.EXECUTION_PREVIEW == 'true'
        with:
          name: trypane-fixed-execution-preview
          path: dist/execution-preview/
          if-no-files-found: error
      - name: Build and verify the editable hosting candidate
        if: env.EDITABLE_PREVIEW == 'true'
        run: |
          set -euo pipefail
          dotnet publish prototype/browser-csharp/TryPane.Compiler.csproj -c Release -o dist/editable-compiler -p:EnableEditableRehearsal=true
          cp prototype/browser-csharp/editable-worker.mjs dist/editable-compiler/wwwroot/
          bash prototype/browser-csharp/runner-host/tools-stage-preview.sh dist/editable-rehearsal "$GITHUB_SHA" dist/editable-compiler editable
          docker build -t trypane-runner-host:ci dist/editable-rehearsal/runner
          TRYPANE_EDITABLE_REHEARSAL=1 node tests/browser/execution-probe.mjs
      - uses: actions/upload-artifact@v4
        if: env.EDITABLE_PREVIEW == 'true'
        with:
          name: trypane-editable-csharp-preview
          path: dist/editable-rehearsal/
          if-no-files-found: error
          retention-days: 7
