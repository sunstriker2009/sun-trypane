name: Browser C# compiler
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/browser-csharp.yml'
      - 'prototype/browser-csharp/**'
      - 'tests/browser/execution-probe.mjs'
permissions:
  contents: read
jobs:
  compiler-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build browser runtime
        run: |
          probe=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then probe=true; fi
          dotnet publish prototype/browser-csharp/TryPane.Compiler.csproj -c Release -o dist/compiler -p:EnableExecutionProbe="$probe"
          if [[ "$probe" == true ]]; then
            cp prototype/browser-csharp/probe-worker.mjs dist/compiler/wwwroot/
          fi
      - name: Check browser C# in Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            export TRYPANE_CHROME_PATH=$(command -v google-chrome)
          else
            npx playwright install chromium --with-deps
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            node tests/browser/execution-probe.mjs
            exit
          fi
          python3 -m http.server 8077 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8077/demo/csharp-check.html -o /dev/null; then break; fi
            sleep 0.25
          done
          node tests/browser/compiler-smoke.mjs http://127.0.0.1:8077/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: trypane-browser-csharp-compiler
          path: |
            demo/csharp-check.html
            demo/demo.css
            dist/demo/csharp-check.js
            dist/src/pane.js
            dist/src/runner.js
            dist/compiler/wwwroot/
            dist/compiler-measurements.json
          if-no-files-found: error
