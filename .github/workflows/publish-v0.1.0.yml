name: Publish TryPane 0.1.0
on: workflow_dispatch

permissions: {}
concurrency: trypane-release-v0.1.0

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 4ffc24684219a4f5bd36a366f4a78529e4011139
      CI_RUN: '45736156458'
      TAG: v0.1.0
    steps:
      - name: Verify and download the tested bundle
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN" --jq '[.conclusion,.head_sha,.head_branch,.event,.path] | join(" ")')
          test "$run" = "success $RELEASE_COMMIT main push .github/workflows/ci.yml"
          ancestry=$(gh api "repos/$GH_REPO/compare/$RELEASE_COMMIT...main" --jq '.status')
          [[ "$ancestry" == ahead || "$ancestry" == identical ]]
          gh run download "$CI_RUN" -n trypane-regex-preview -D "$RUNNER_TEMP/trypane-release"
          bundle="$RUNNER_TEMP/trypane-release/dist/package/trypane-regex-0.1.0.tar.gz"
          tar -xOzf "$bundle" trypane-regex-0.1.0/manifest.json |
            jq -e --arg commit "$RELEASE_COMMIT" '.version == "0.1.0" and .sourceCommit == $commit'
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$RELEASE_COMMIT" --jq .content |
            base64 --decode > "$RUNNER_TEMP/release-notes.md"

      - name: Create the annotated tag and publish the bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/trypane-release/dist/package/trypane-regex-0.1.0.tar.gz"
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | [.type,.sha] | join(" ")'); then
            read -r type tag_sha <<< "$existing"
            test "$type" = tag
            test "$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object | [.type,.sha] | join(" ")')" = "commit $RELEASE_COMMIT"
          else
            tag_sha=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="TryPane 0.1.0" -f object="$RELEASE_COMMIT" -f type=commit --jq .sha)
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_sha" --silent
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$bundle" --verify-tag --title "TryPane 0.1.0" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release view "$TAG" --json isDraft,assets,url |
            jq -er 'select(.isDraft == false and any(.assets[]; .name == "trypane-regex-0.1.0.tar.gz" and .state == "uploaded" and .size > 0)) | .url'
