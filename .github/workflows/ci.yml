name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository-validation:
    outputs:
      pages-source: ${{ steps.pages.outputs.source }}
    name: repository-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/CODEOWNERS
          test -f docs/REPOSITORY-SETUP.md
          echo "SUN repository foundation valid"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: bash tools-build-runtime.sh
      - name: Build versioned Regex bundle
        run: bash tools-package-preview.sh "${{ github.sha }}"
      - name: Stage the public demo site
        run: bash tools-stage-site.sh "$RUNNER_TEMP/trypane-pages"
      - name: Check Regex and incremental output in Chromium
        env:
          TRYPANE_SITE_ROOT: ${{ runner.temp }}/trypane-pages
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            TRYPANE_CHROME_PATH=$(command -v google-chrome) node tests/browser/regex-smoke.mjs
          else
            npx playwright install chromium --with-deps
            node tests/browser/regex-smoke.mjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trypane-regex-preview
          path: |
            dist/
            demo/
          if-no-files-found: error
      - name: Check the Pages source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type); then
            echo "source=$source" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${source:-}" != workflow ]]; then
            echo "::notice::Select GitHub Actions in Settings → Pages, then run CI on main to publish the demos."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.source == 'workflow'
        with:
          path: ${{ runner.temp }}/trypane-pages

  deploy-pages:
    needs: repository-validation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.repository-validation.outputs.pages-source == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: trypane-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
