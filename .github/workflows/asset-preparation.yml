name: Optional asset preparation
# Intentionally manual-only. Product owners must adopt the pinned FOUNDRY scripts
# and approve artwork before enabling any path-filtered PR checks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check opt-in prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/prepare-assets.py assets/requirements.txt branding/asset-config.json; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing $path. Follow docs/ASSET-PREPARATION.md to opt in."
              exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r assets/requirements.txt
      - name: Generate and verify unpromoted derivatives
        run: |
          python scripts/prepare-assets.py --product-root . --config branding/asset-config.json
          python scripts/prepare-assets.py --product-root . --config branding/asset-config.json --check
      - name: Upload generated assets for human review
        uses: actions/upload-artifact@v4
        with:
          name: sun-asset-preparation-review
          path: branding/generated/
          if-no-files-found: error
          retention-days: 7
