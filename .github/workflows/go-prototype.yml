name: Go prototype
on:
  pull_request:
    paths:
      - '.github/workflows/go-prototype.yml'
      - 'prototype/go/**'
      - 'prototype/container-runner.mjs'
      - 'prototype/snippet-limits.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Go runner image
        run: docker build -t trypane-go-prototype:local-v1 prototype/go
      - name: Check the Go runner
        run: node --test prototype/go/smoke.mjs
