name: Notify Foundry of a symbol update
on:
  push:
    branches: [main]
    paths:
      - 'branding/assets/symbol.png'
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    uses: sunstriker2009/sun-foundry/.github/workflows/notify-gallery-symbol.yml@04ea2cc441fcb4e58d5081d09160acfa1f6abb1a
    secrets:
      app_id: ${{ secrets.SUN_SYMBOL_RELAY_APP_ID }}
      app_private_key: ${{ secrets.SUN_SYMBOL_RELAY_APP_PRIVATE_KEY }}
