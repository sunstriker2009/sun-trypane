<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://*.chatgpt.site; object-src 'none'; base-uri 'none'">
    <title>TryPane runner bridge check</title>
    <link rel="stylesheet" href="demo.css">
    <script type="module" src="../dist/demo/execution-probe.js"></script>
  </head>
  <body>
    <main>
      <p><a href="../">TryPane demos</a></p>
      <h1>Check the private runner connection</h1>
      <p>Run built-in C# examples through your private runner Site.</p>
      <p id="bridge-setup" role="status">Open this page with a private runner link.</p>
      <p><a id="runner-sign-in" target="_blank" rel="noopener noreferrer" hidden>Open the private runner and sign in</a></p>
      <div id="probe-controls" hidden>
        <label for="probe">Fixed probe</label>
        <select id="probe">
          <option value="console">Console output</option>
          <option value="cancel">Long-running example</option>
        </select>
        <div id="try-it"></div>
      </div>
    </main>
  </body>
</html>
