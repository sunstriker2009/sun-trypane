<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TryPane programmatic Regex</title>
    <link rel="stylesheet" href="demo.css">
    <script type="module" src="../dist/demo/programmatic.js"></script>
  </head>
  <body>
    <main>
      <p><a href="../">TryPane demos</a></p>
      <h1>Programmatic Regex</h1>
      <p>This page starts a C# Regex run when it opens. The host listens for state changes and renders its own result.</p>
      <h2>Input</h2>
      <pre id="source"></pre>
      <h2>Result</h2>
      <p id="status" role="status">Preparing example…</p>
      <pre id="result" aria-label="Regex result"></pre>
      <p><a href="https://github.com/sunstriker2009/sun-trypane/blob/main/demo/programmatic.ts">View the example source</a></p>
    </main>
